  gpu-id: 0
  width: 128     # Debe ser igual al streammux para evitar el desfase
  height: 128    # Debe ser igual al streammux para evitar el desfase
  input-entity-id: 2
  orig_background: 1
  alpha: 0.5


eglsink:
  enable: 1
  width: 854
  height: 480

filesink:
  enable: 0
  #encoder type 0=Hardware 1=Software
  enc-type: 0

fakesink:
  enable: 0

tests:
