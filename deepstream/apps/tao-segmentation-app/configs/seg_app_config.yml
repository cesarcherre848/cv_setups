
source-list:
  list: file:////opt/nvidia/deepstream/deepstream-7.1/apps/tao-segmentation-app/chunks/chunk_001.mp4

streammux:
  batch-size: 1
  width: 512    
  height: 512
  batched-push-timeout: 40000


# PGIE: tu SegFormer
primary-gie:
  plugin-type: 0
  config-file-path: ../configs/citysemsegformer_tao/pgie_citysemsegformer_tao_config.yml
